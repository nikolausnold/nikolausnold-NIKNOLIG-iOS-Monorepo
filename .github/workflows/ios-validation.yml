name: iOS validation

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      confirm_readiness_check:
        description: Run release readiness checks only; this does not authorize publication.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Swift tests and both iOS apps
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUILD_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && 'Release' || 'Debug' }}
    steps:
      - name: Require founder confirmation for manual readiness checks
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CONFIRMED: ${{ inputs.confirm_readiness_check }}
          SELECTED_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$ACTOR" != "nikolausnold" ||
                "$TRIGGERING_ACTOR" != "nikolausnold" ||
                "$CONFIRMED" != "true" ||
                "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Manual readiness checks require nikolausnold, explicit confirmation, and the default branch."
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Test shared packages
        run: swift test
      - name: Build NIKNOLIG
        run: |
          xcodebuild -project apps/niknolig-ios/NIKNOLIG.xcodeproj \
            -scheme NIKNOLIG -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build NIKNOLIG Defense
        run: |
          xcodebuild -project apps/niknolig-defense-ios/NIKNOLIGDefense.xcodeproj \
            -scheme 'NIKNOLIG Defense' -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
